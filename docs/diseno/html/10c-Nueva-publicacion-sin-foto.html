<!doctype html>
<html><head><meta charset="utf-8">

<style>
body { margin: 0; font-family: 'Source Sans 3', system-ui, sans-serif; background: #F7F4EE; color: #1C2B2A; }
a { color: #1F6B65; } a:hover { color: #164B47; }
textarea { font-family: inherit; }
textarea::placeholder { color: #7A8886; }
</style>
<title>Nueva publicación (sin foto)</title></head><body style="margin:0">


<div style="position: relative; width: 390px; height: 844px; box-sizing: border-box; background: #FFFFFF; display: flex; flex-direction: column; overflow: hidden">

  <div style="flex-shrink: 0; box-sizing: border-box; padding: 50px 12px 8px; background: #FFFFFF; border-bottom: 1px solid #E4DED2; display: flex; align-items: center">
    <a href="Inicio.dc.html" aria-label="Cancelar y volver al foro" style="flex-shrink: 0; width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; background: #E7F1EF; border-radius: 13px; text-decoration: none">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#1F6B65" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 6l12 12"></path><path d="M18 6 6 18"></path></svg>
    </a>
    <h1 style="margin: 0; flex-grow: 1; text-align: center; font-family: 'Nunito', system-ui, sans-serif; font-weight: 800; font-size: 18px; color: #1F6B65">Nueva publicación</h1>
    <a href="Inicio.dc.html" style="flex-shrink: 0; box-sizing: border-box; height: 44px; padding: 0 18px; display: flex; align-items: center; justify-content: center; background: #1F6B65; border-radius: 13px; font-family: 'Nunito', system-ui, sans-serif; font-weight: 800; font-size: 15.5px; color: #FFFFFF; text-decoration: none">Publicar</a>
  </div>

  <div style="flex-grow: 1; min-height: 0; box-sizing: border-box; padding: 16px 20px 12px; display: flex; flex-direction: column; gap: 14px; overflow-y: auto; overflow-x: hidden; scrollbar-width: none">

    <div style="flex-shrink: 0; display: flex; align-items: center; gap: 12px">
      <span aria-hidden="true" style="width: 44px; height: 44px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; background: #F19700; border-radius: 999px; font-family: 'Nunito', system-ui, sans-serif; font-weight: 800; font-size: 15px; color: #1C2B2A">MR</span>
      <span style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px; align-items: flex-start">
        <span style="font-family: 'Nunito', system-ui, sans-serif; font-weight: 800; font-size: 16px; color: #16302E">Marcela Ramírez</span>
        <span style="box-sizing: border-box; padding: 1px 9px; border-radius: 999px; font-size: 11.5px; font-weight: 600; background: #EFE9DC; color: #40514F">Familia</span>
      </span>
    </div>

    <div style="flex-shrink: 0; display: flex; flex-direction: column; gap: 6px">
      <textarea aria-label="Escribe tu publicación" rows="3" placeholder="¿Qué quieres compartir con la comunidad?" style="box-sizing: border-box; width: 100%; padding: 0; border: 0; outline: 0; resize: none; background: transparent; font-size: 17px; line-height: 1.45; color: #1C2B2A">Primer día de terapia con perros. ¡Mírenle la sonrisa, hizo una nueva amiga!</textarea>
    </div>

    

    <div style="flex-shrink: 0; display: flex; flex-direction: column; gap: 8px">
      <span style="font-size: 11.5px; font-weight: 700; letter-spacing: 0.06em; color: #5A6B69">ELIGE UN TEMA</span>
      <div style="display: flex; gap: 8px">
        
          <button type="button" role="radio" aria-checked="true" style="box-sizing: border-box; height: 38px; padding: 0 16px; display: flex; align-items: center; font-family: inherit; font-size: 14px; font-weight: 700; border-radius: 999px; background: #2F6AB0; color: #FFFFFF; border: 1.5px solid #2F6AB0; cursor: pointer">Preguntas</button>
        
          <button type="button" role="radio" aria-checked="false" style="box-sizing: border-box; height: 38px; padding: 0 16px; display: flex; align-items: center; font-family: inherit; font-size: 14px; font-weight: 700; border-radius: 999px; background: #FFFFFF; color: #17544F; border: 1.5px solid #1F6B65; cursor: pointer">Guías</button>
        
          <button type="button" role="radio" aria-checked="false" style="box-sizing: border-box; height: 38px; padding: 0 16px; display: flex; align-items: center; font-family: inherit; font-size: 14px; font-weight: 700; border-radius: 999px; background: #FFFFFF; color: #4A2A72; border: 1.5px solid #7B4FB0; cursor: pointer">Logros</button>
        
      </div>
    </div>

  </div>

  <div style="flex-shrink: 0; box-sizing: border-box; padding: 12px 0 30px; background: #F7F4EE; border-top: 1px solid #E4DED2; display: flex; flex-direction: column; gap: 10px">
    <div style="padding: 0 20px; display: flex; align-items: center; justify-content: space-between">
      <span style="font-family: 'Nunito', system-ui, sans-serif; font-weight: 800; font-size: 14.5px; color: #16302E">Recientes</span>
      <span style="font-size: 13px; font-weight: 600; color: #1F6B65">Galería</span>
    </div>
    <div style="padding: 0 20px; display: flex; gap: 8px">
      <button type="button" aria-label="Abrir la cámara" style="flex-shrink: 0; box-sizing: border-box; width: 80px; height: 80px; padding: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-family: inherit; background: #FFFFFF; border: 1.5px dashed #B8AF9C; border-radius: 14px; cursor: pointer">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#1F6B65" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8.5A1.5 1.5 0 0 1 5.5 7H8l1.4-2h5.2L16 7h2.5A1.5 1.5 0 0 1 20 8.5v9a1.5 1.5 0 0 1-1.5 1.5h-13A1.5 1.5 0 0 1 4 17.5Z"></path><circle cx="12" cy="13" r="3.4"></circle></svg>
        <span style="font-size: 12px; font-weight: 600; color: #1F6B65">Cámara</span>
      </button>
      
        <button type="button" aria-label="Niña con gafas rojas sonríe junto a un perro" aria-pressed="false" style="position: relative; flex-shrink: 0; box-sizing: border-box; width: 80px; height: 80px; padding: 0; overflow: hidden; border: 3px solid transparent; border-radius: 14px; background: #EEF4F9; cursor: pointer">
          <img src="img/foro-perro.jpg" alt="" style="display: block; width: 100%; height: 100%; object-fit: cover">
          <span aria-hidden="true" style="position: absolute; top: 4px; right: 4px; width: 22px; height: 22px; display: flex; align-items: center; justify-content: center; border-radius: 999px; background: rgba(22, 48, 46, 0.35); border: 2px solid #FFFFFF; font-family: 'Nunito', system-ui, sans-serif; font-weight: 800; font-size: 11px; color: #FFFFFF"></span>
        </button>
      
        <button type="button" aria-label="Infografía de apoyo" aria-pressed="false" style="position: relative; flex-shrink: 0; box-sizing: border-box; width: 80px; height: 80px; padding: 0; overflow: hidden; border: 3px solid transparent; border-radius: 14px; background: #EEF4F9; cursor: pointer">
          <img src="img/foro-infografia.jpg" alt="" style="display: block; width: 100%; height: 100%; object-fit: cover">
          <span aria-hidden="true" style="position: absolute; top: 4px; right: 4px; width: 22px; height: 22px; display: flex; align-items: center; justify-content: center; border-radius: 999px; background: rgba(22, 48, 46, 0.35); border: 2px solid #FFFFFF; font-family: 'Nunito', system-ui, sans-serif; font-weight: 800; font-size: 11px; color: #FFFFFF"></span>
        </button>
      
        <button type="button" aria-label="Taller de acordeones" aria-pressed="false" style="position: relative; flex-shrink: 0; box-sizing: border-box; width: 80px; height: 80px; padding: 0; overflow: hidden; border: 3px solid transparent; border-radius: 14px; background: #EEF4F9; cursor: pointer">
          <img src="img/foro-acordeones.jpg" alt="" style="display: block; width: 100%; height: 100%; object-fit: cover">
          <span aria-hidden="true" style="position: absolute; top: 4px; right: 4px; width: 22px; height: 22px; display: flex; align-items: center; justify-content: center; border-radius: 999px; background: rgba(22, 48, 46, 0.35); border: 2px solid #FFFFFF; font-family: 'Nunito', system-ui, sans-serif; font-weight: 800; font-size: 11px; color: #FFFFFF"></span>
        </button>
      
    </div>
  </div>

</div>
</body></html>
